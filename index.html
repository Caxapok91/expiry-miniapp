<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сроки годности</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: var(--tg-theme-text-color, #000000);
        }
        .button {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Сроки годности</h1>
        <p>Привет, <span id="username">пользователь</span>!</p>

        <div class="card">
            <p>Это Mini App. Пока здесь ничего нет, но скоро появятся:</p>
            <ul>
                <li>📷 Сканер штрихкодов</li>
                <li>🗓 Интерактивный календарь</li>
                <li>📦 Список товаров</li>
            </ul>
        </div>

        <button class="button" onclick="closeApp()">
            Закрыть
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;

        // Сообщаем Telegram, что приложение готово
        tg.ready();
        tg.expand();

        // Показываем имя пользователя
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').textContent =
                tg.initDataUnsafe.user.first_name || 'друг';
        }

        // Функция закрытия приложения
        function closeApp() {
            tg.close();
        }

        // Тестовое сообщение в консоль
        console.log('Mini App запущен!', tg.initDataUnsafe);
    </script>
</body>
</html>
